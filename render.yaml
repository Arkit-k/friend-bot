services:
  # Discord Bot Service
  - type: worker
    name: friendship-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python discord_bot.py
    plan: free
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        sync: false
